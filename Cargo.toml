[package]
name = "view-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"
required-features = ["app"]

[features]
app = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-core-graphics", "dep:objc2-av-kit", "dep:objc2-av-foundation", "dep:block2", "dep:dispatch2", "dep:objc2-quick-look-thumbnailing", "dep:objc2-quick-look-ui", "dep:objc2-quick-look", "dep:objc2-uniform-type-identifiers"]
benchmark = ["app", "dep:rustybench"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSWindow", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSImageView", "NSScrollView", "NSCollectionView", "NSViewController", "NSProgressIndicator", "NSTextField", "NSBox", "NSColor", "NSFont", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSGridView", "NSStackView", "NSCell", "NSBezierPath", "NSParagraphStyle", "NSText"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSGeometry", "NSArray", "NSDictionary", "NSNotification", "NSUserDefaults", "NSValue", "NSProcessInfo", "NSKeyValueObserving"] }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-av-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "AVPlayerView", "objc2-app-kit", "objc2-av-foundation"] }
objc2-av-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "AVAsset", "AVPlayer", "AVPlayerItem"] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-quick-look-thumbnailing = { version = "0.3", optional = true }
objc2-quick-look-ui = { version = "0.3", optional = true }
objc2-quick-look = { version = "0.3", optional = true }
objc2-uniform-type-identifiers = { version = "0.3", optional = true }
rustybench = { version = "0.4", optional = true }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[dev-dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSDraggingItem", "NSPasteboardItem", "NSPasteboard"] }
objc2-quick-look-thumbnailing = "0.3"
block2 = "0.6"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
strip = false

[[test]]
name = "app_regression"
path = "tests/app_regression.rs"
required-features = ["app"]

[[bench]]
name = "view"
harness = false
required-features = ["benchmark"]
